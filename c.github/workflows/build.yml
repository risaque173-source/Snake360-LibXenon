name: Build Snake 360 (LibXenon)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside the official LibXenon container
        run: |
          docker pull free60/libxenon:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            free60/libxenon:latest \
            sh -lc 'export DEVKITXENON=/usr/local/xenon; export PATH="$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin"; make'

      - name: Collect ELF outputs
        run: |
          mkdir -p dist
          find . -maxdepth 3 -type f \( -name 'snake360.elf' -o -name 'snake360.elf32' \) -exec cp {} dist/ \;
          test -n "$(find dist -type f -name 'snake360.elf*' -print -quit)"

      - name: Upload Xbox 360 ELF
        uses: actions/upload-artifact@v4
        with:
          name: Snake360-XeLL-ELF
          path: dist/*
          if-no-files-found: error
