      - name: Procurar ELF
        run: |
          echo "Procurando arquivos ELF..."
          find . -type f \( -name "*.elf" -o -name "*.elf32" \) -print

          mkdir -p dist

          find . -type f \( -name "*.elf" -o -name "*.elf32" \) \
            ! -path "./dist/*" -exec cp {} dist/ \;

          echo "Arquivos encontrados:"
          ls -lh dist

          test -n "$(find dist -type f)"
